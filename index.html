<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overclocked</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>OVERCLOCKED</h1>

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="attendance" placeholder="Attendance %">

        <input type="number" id="assignments" placeholder="Pending Assignments">

        <input type="number" id="sleep" placeholder="Hours Slept">

        <input type="number" id="exams" placeholder="Exams in Days">

        <button onclick="checkStatus()">Analyze System</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
